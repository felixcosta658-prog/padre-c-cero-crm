<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir Projeto - Fábrica de Cabos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      min-height: 100vh; display: grid; place-items: center; background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px 48px;
      max-width: 480px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo { font-size: 42px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    a.btn {
      display: block; background: #3b82f6; color: #fff; text-decoration: none; font-weight: 600;
      padding: 14px 20px; border-radius: 10px; font-size: 15px; transition: background .2s;
    }
    a.btn:hover { background: #2563eb; }
    .status { margin-top: 16px; font-size: 13px; color: #64748b; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.on { background: #22c55e; }
    .dot.off { background: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏭</div>
    <h1>Fábrica de Cabos</h1>
    <p>Clique abaixo para abrir o projeto. Se o servidor ainda não estiver ligado, use o atalho <strong>abrir-projeto.bat</strong>.</p>
    <a class="btn" id="open" href="http://localhost:8080/" target="_blank">Abrir projeto</a>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Verificando servidor…</span></div>
  </div>
  <script>
    const dot = document.getElementById('dot');
    const statusEl = document.getElementById('status');
    fetch('http://localhost:8080/', { method: 'GET', cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); dot.className = 'dot on'; statusEl.textContent = 'Servidor online ✔'; })
      .catch(() => { dot.className = 'dot off'; statusEl.textContent = 'Servidor offline — use o abrir-projeto.bat'; });
  </script>
</body>
</html>
